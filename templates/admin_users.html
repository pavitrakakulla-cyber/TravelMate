<!DOCTYPE html>
<html>
<head>
    <title>Admin - Users</title>
</head>

<body>

    <h1>All Users</h1>

    <a href="/admin/dashboard">
        Back to Dashboard
    </a>

    <hr>

    {% if users %}

        {% for user in users %}

            <h2>User #{{ user.user_id }}</h2>

            <p>
                <strong>Name:</strong>
                {{ user.full_name }}
            </p>

            <p>
                <strong>Email:</strong>
                {{ user.email }}
            </p>

            <p>
                <strong>Phone:</strong>
                {{ user.phone }}
            </p>

            <hr>

        {% endfor %}

    {% else %}

        <p>No users found.</p>

    {% endif %}

</body>
</html>
