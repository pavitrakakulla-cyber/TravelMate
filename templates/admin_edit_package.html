<!DOCTYPE html>
<html>
<head>
    <title>Edit Package - TravelMate</title>
</head>

<body>

    <h1>Edit Package</h1>

    <form method="POST">

        <label>Package Title</label>
        <br>
        <input
            type="text"
            name="title"
            value="{{ package.title }}"
            required
        >

        <br><br>

        <label>Destination</label>
        <br>
        <input
            type="text"
            name="destination"
            value="{{ package.destination }}"
            required
        >

        <br><br>

        <label>Description</label>
        <br>
        <textarea
            name="description"
            required
        >{{ package.description }}</textarea>

        <br><br>

        <label>Duration Days</label>
        <br>
        <input
            type="number"
            name="duration_days"
            value="{{ package.duration_days }}"
            min="1"
            required
        >

        <br><br>

        <label>Duration Nights</label>
        <br>
        <input
            type="number"
            name="duration_nights"
            value="{{ package.duration_nights }}"
            min="0"
            required
        >

        <br><br>

        <label>Base Price</label>
        <br>
        <input
            type="number"
            name="base_price"
            value="{{ package.base_price }}"
            min="0"
            step="0.01"
            required
        >

        <br><br>

        <label>Image URL</label>
        <br>
        <input
            type="text"
            name="image_url"
            value="{{ package.image_url or '' }}"
        >

        <br><br>

        <button type="submit">
            Update Package
        </button>

    </form>

    <br>

    <a href="/admin/packages">
        Cancel
    </a>

</body>
</html>
